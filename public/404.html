<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found: Recurse Labs</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#06070a" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px;
      background: #06070a; color: #e9edf3;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .box { width: 100%; max-width: 560px; border: 1px solid rgba(255,255,255,.09); background: #0a0c11; }
    .bar {
      display: flex; align-items: center; gap: 10px; padding: 11px 16px;
      border-bottom: 1px solid rgba(255,255,255,.09);
      font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: #69727f;
    }
    .dot { width: 7px; height: 7px; background: #ff7a5c; }
    .body { padding: 28px 16px 30px; }
    h1 { margin: 0 0 12px; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
    p { margin: 0 0 22px; color: #9aa4b2; font-size: 13px; line-height: 1.6; }
    a {
      display: inline-block; padding: 10px 16px; text-decoration: none;
      border: 1px solid rgba(255,255,255,.16); color: #7ec8ff;
      font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    }
    a:hover { border-color: #7ec8ff; }
  </style>
</head>
<body>
  <div class="box">
    <div class="bar"><span class="dot"></span> 404 / no such address</div>
    <div class="body">
      <h1>Nothing is mapped here.</h1>
      <p>That path does not exist on this site.</p>
      <a href="/">Back to Recurse Labs</a>
    </div>
  </div>
</body>
</html>
